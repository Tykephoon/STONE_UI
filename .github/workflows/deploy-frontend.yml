name: Deploy frontend to GitHub Pages

# Builds the static SPA and publishes it to Pages on every push to main.
#
# The build takes no configuration and no secrets. The app has no server, no
# accounts, and no third-party keys, so there is nothing to inject — everything
# it produces is public by definition, and a secret here would be a published
# secret.
#
# If a future change makes this workflow need `secrets.*`, that is the signal
# the design has gone wrong. See SECURITY.md.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Read-only by default; the deploy job widens this to exactly what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  # Let an in-progress deploy finish rather than publishing a half-uploaded site.
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, test, and audit the bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_ENVIRONMENT_LABEL: production
        # `npm run build` ends with the bundle secret scan, which fails the
        # build if anything credential-shaped reached the output.
        run: npm run build

      # Deep links must survive a refresh. The app uses a hash router, so this
      # is belt-and-braces for anyone who lands on a path-style URL.
      - name: Add 404 fallback and Jekyll opt-out
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publish to Pages
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
