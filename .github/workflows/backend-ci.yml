name: Backend CI

# Typecheck, test, and build the API on every change to it.
#
# Deployment is not automated: the API holds the database and every credential,
# and pushing it should be a deliberate act. `fly deploy` is documented in
# README.md.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (including tests)
        run: npm run typecheck

      - name: Test
        # Tests build their own in-memory database, so no service container and
        # no environment configuration is needed.
        run: npm test

      - name: Build
        run: npm run build
