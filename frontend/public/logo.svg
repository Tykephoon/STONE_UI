<!--
  In-app logo, rendered by src/components/layout/Logo.tsx.

  viewBox stays 0 0 32 -> 132x32: Logo.module.css `.markOnly` crops this asset
  to its leftmost ~38 units for the collapsed sidebar, so the seal must stay
  inside that band and the wordmark must start after it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 32" width="132" height="32" role="img" aria-label="Stone">
  <image href="data:image/png;base64," x="1" y="0" width="32" height="32"/>
  <text x="40" y="22" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="16.5" font-weight="600" letter-spacing="0.14em" fill="#e8e5de">STONE</text>
</svg>
